# Publish the live map to GitHub Pages (https://jakeperc.github.io/blockchain-flow-map/) on every push to main.
#
# The build is the same gated build as verify.yml: `pnpm build:live` runs scripts/verify-all.mjs (the eight
# verifiers and the type check) before Vite builds anything, so a commit that fails a verifier is never published
# and the live copy stays on the last commit that passed. The build uses relative paths, so the folder name does
# not matter. Canonical links, og:image and llms.txt still name jakepercy.com, which stays the canonical home;
# Jake uploads that copy by FTP (HANDOFF.md sections 1 and 35).
#
# Never add a schedule: verify-registry.cjs fails by the calendar on purpose, so a scheduled run would go red with
# no change. Run it by hand (workflow_dispatch) to republish without a commit.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A run already deploying finishes; runs queued behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-live/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
