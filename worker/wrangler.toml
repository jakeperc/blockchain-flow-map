# The history recorder (decision D8, docs/DECISIONS-2026-09.md). No account ID and no secrets here: wrangler reads the
# account from `wrangler login` locally and from CLOUDFLARE_ACCOUNT_ID in CI. Run wrangler from the repository root with
# `--config worker/wrangler.toml`; worker/README.md has the commands.
name = "bfm-recorder"
main = "index.ts"
compatibility_date = "2026-10-01"
# The public, read-only API (D8 point 11) is served at this Worker's workers.dev address.
workers_dev = true
preview_urls = false

[triggers]
# Every minute: prices, the live reads, a paced slice of the backfill, the quarter hours now due, then publishing.
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bfm-recorder"
# Created 2026-10-26 by `wrangler d1 create bfm-recorder` (region ENAM). Not a secret: it names the database, and only
# an account's own credentials can reach it.
database_id = "b0ac89a8-dadf-4d8b-957c-138b27d3cdfd"
migrations_dir = "migrations"

[[r2_buckets]]
# The day files and the manifest. R2 is strongly consistent, so the manifest never names a file the bucket lacks.
binding = "HISTORY"
bucket_name = "bfm-history"

[observability]
enabled = true

[limits]
# Cloudflare has no spending cap. A sub-hourly cron may use at most 30 s of CPU, and a run stops starting new work after
# RUN_BUDGET_MS of wall time (index.ts), so this is a ceiling for a bug, not a budget.
cpu_ms = 30000
